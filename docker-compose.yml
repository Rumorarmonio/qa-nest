services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:17.3-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17.3-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data

  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    volumes:
      - ./adminer.theme.css:/var/www/html/adminer.css:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  pgdata-test:
